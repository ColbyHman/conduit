# AI Gateway Configuration
# Environment variables override these values

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  url: "postgres://conduit:conduit_dev@localhost:5432/conduit?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

logging:
  level: "info"
  pretty: false
  file_path: ""
  max_size_mb: 10
  max_backups: 3
  max_age_days: 7

idempotency:
  header_name: "Idempotency-Key"
  max_key_length: 64